services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-local
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  auth-gateway:
    build:
      context: ./auth-gateway
    container_name: auth-gateway
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://auth-postgres:5432/auth_gateway
      DATABASE_USER: auth
      DATABASE_PASSWORD: auth
      JWT_SECRET: change-me-in-production
      MARKET_SERVICE_URL: http://market-data-service:8080/api/v1
      ORDER_SERVICE_URL: http://trading-service:8080/api/v1
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8080/api/v1
    ports:
      - "8080:8080"

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_gateway
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres-init.sql:/docker-entrypoint-initdb.d/00_create_trading_db.sql
      - ./portfolio-service/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_portfolio_schema.sql
      - ./portfolio-service/migrations/002_drop_trade_fk.sql:/docker-entrypoint-initdb.d/02_drop_trade_fk.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  portfolio-service:
    build: ./portfolio-service
    container_name: portfolio-service
    ports:
      - "8081:8080"
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/portfolio?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: trading-events
      KAFKA_GROUP_ID: portfolio-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  trading-service:
    build: ./trading-service
    container_name: trading-service
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: trading-events
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "8090:8080"
    environment:
      URLS: >
        [
          {"url":"/swagger/auth-gateway.yml","name":"Auth Gateway"},
          {"url":"/swagger/order-service.yml","name":"Order Service"},
          {"url":"/swagger/portfolio-service.yml","name":"Portfolio Service"},
          {"url":"/swagger/market-data-service.yml","name":"Market Data Service"}
        ]
    volumes:
      - ./swagger:/swagger:ro

volumes:
  auth_pgdata:
  pgdata:
