services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-local
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: market_data
      CLICKHOUSE_PASSWORD: market_data_password
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  auth-gateway:
    build:
      context: ./auth-gateway
    container_name: auth-gateway
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_gateway
      DATABASE_USER: auth
      DATABASE_PASSWORD: auth
      JWT_SECRET: change-me-in-production
      MARKET_SERVICE_URL: http://market-data-service:8081/api/v1
      ORDER_SERVICE_URL: http://trading-service:8083/api/v1
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8082/api/v1
      OTEL_EXPORTER_ENDPOINT: jaeger:4317
      DATABASE_POOL_SIZE: 50
    ports:
      - "8080:8080"

  market-data-service:
    build:
      context: ./market-data-service
    container_name: market-data-service
    depends_on:
      - clickhouse
      - jaeger
    environment:
      HTTP_PORT: 8081
      HTTP_BASE_PATH: /api/v1
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: market_data
      CLICKHOUSE_PASSWORD: market_data_password
      OTEL_EXPORTER_ENDPOINT: jaeger:4317
    ports:
      - "8081:8081"
      
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    command: postgres -c max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres-init.sql:/docker-entrypoint-initdb.d/00_create_trading_db.sql
      - ./portfolio-service/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_portfolio_schema.sql
      - ./portfolio-service/migrations/002_drop_trade_fk.sql:/docker-entrypoint-initdb.d/02_drop_trade_fk.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic trading-events --partitions 1 --replication-factor 1 && echo 'Topic trading-events created'"
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.16.0
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  portfolio-service:
    build: ./portfolio-service
    container_name: portfolio-service
    ports:
      - "8082:8082"
    environment:
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/portfolio?sslmode=disable
      MARKET_DATA_URL: http://market-data-service:8081/api/v1
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: trading-events
      KAFKA_GROUP_ID: portfolio-service
      OTEL_EXPORTER_ENDPOINT: jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  trading-service:
    build: ./trading-service
    container_name: trading-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: trading-events
      SERVER_PORT: "8083"
      MARKET_DATA_URL: http://market-data-service:8081/api/v1
      PORTFOLIO_URL: http://portfolio-service:8082
      OTEL_EXPORTER_ENDPOINT: jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    ports:
      - "8090:8090"
    environment:
      URLS: >
        [
          {"url":"/swagger/auth-gateway.yml","name":"Auth Gateway"},
          {"url":"/swagger/order-service.yml","name":"Order Service"},
          {"url":"/swagger/portfolio-service.yml","name":"Portfolio Service"},
          {"url":"/swagger/market-data-service.yml","name":"Market Data Service"}
        ]
    volumes:
      - ./swagger:/swagger:ro

  load-service:
    build:
      context: ./load-service
    container_name: load-service
    profiles:
      - load
    depends_on:
      auth-gateway:
        condition: service_started
      market-data-service:
        condition: service_started
      portfolio-service:
        condition: service_started
      trading-service:
        condition: service_started
    environment:
      PORT: 8095
      GATEWAY_URL: http://auth-gateway:8080/api/v1
      VIRTUAL_USERS: ${LOAD_USERS:-1000}
      MAX_VIRTUAL_USERS: 10000
      DURATION_SECONDS: ${LOAD_DURATION_SECONDS:-300}
      RAMP_UP_SECONDS: ${LOAD_RAMP_UP_SECONDS:-300}
      REQUEST_TIMEOUT_MS: ${LOAD_REQUEST_TIMEOUT_MS:-30000}
      ORDER_EVERY_N_ITERATIONS: ${LOAD_ORDER_EVERY_N_ITERATIONS:-6}
      WITHDRAW_REQUEST_PERCENT: ${LOAD_WITHDRAW_REQUEST_PERCENT:-5}
      SYSTEM_REQUEST_PERCENT: ${LOAD_SYSTEM_REQUEST_PERCENT:-10}
      PROGRESS_LOG_INTERVAL_SECONDS: ${LOAD_PROGRESS_LOG_INTERVAL_SECONDS:-10}
      HISTORY_WINDOW_SECONDS: ${LOAD_HISTORY_WINDOW_SECONDS:-86400}
      HISTORY_LIMIT: ${LOAD_HISTORY_LIMIT:-100}
      THINK_TIME_MS: ${LOAD_THINK_TIME_MS:-10000}
      RUN_ON_START: ${LOAD_RUN_ON_START:-true}
      START_DELAY_SECONDS: ${LOAD_START_DELAY_SECONDS:-10}
      SYMBOLS: AAPL,MSFT,TSLA,BTCUSDT,ETHUSDT
    ports:
      - "8095:8095"

  load-dashboard:
    image: nginx:alpine
    container_name: load-dashboard
    profiles:
      - load
    volumes:
      - ./load-service/dashboard:/usr/share/nginx/html:ro
    ports:
      - "8096:80"

volumes:
  pgdata:
  clickhouse_data:
  clickhouse_logs:
