services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-local
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: market_data
      CLICKHOUSE_PASSWORD: market_data_password
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  market-data-service:
    build:
      context: ./market-data-service
    container_name: market-data-service
    depends_on:
      - clickhouse
    environment:
      HTTP_PORT: 8080
      HTTP_BASE_PATH: /api/v1
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: market_data
      CLICKHOUSE_PASSWORD: market_data_password
    ports:
      - "8080:8080"
