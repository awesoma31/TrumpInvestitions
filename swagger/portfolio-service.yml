openapi: 3.1.0
info:
  title: Portfolio Service API
  version: 1.0.0
  description: |
    Внутренний сервис портфеля пользователя.

    Ответственность сервиса:
    - хранение и выдача текущих позиций пользователя
    - расчет текущей стоимости портфеля
    - расчет realized/unrealized PnL
    - хранение истории изменений портфеля
    - обработка событий trade_executed / order_filled из Order Service
    - использование последних цен из Market Data Service

servers:
  - url: http://portfolio-service.internal/api/v1
    description: Internal environment

tags:
  - name: Portfolio
  - name: Positions
  - name: Analytics
  - name: History
  - name: Internal
  - name: System

paths:
  /portfolio:
    get:
      tags: [Portfolio]
      summary: Получить текущее состояние портфеля пользователя
      operationId: getPortfolio
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Текущее состояние портфеля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /positions:
    get:
      tags: [Positions]
      summary: Получить текущие позиции пользователя
      operationId: listPositions
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
      responses:
        '200':
          description: Список позиций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /positions/{symbol}:
    get:
      tags: [Positions]
      summary: Получить позицию по конкретному инструменту
      operationId: getPositionBySymbol
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Позиция по инструменту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '404':
          $ref: '#/components/responses/NotFound'

  /pnl:
    get:
      tags: [Analytics]
      summary: Получить сводку по доходности пользователя
      description: |
        Возвращает realized/unrealized/total PnL за указанный период.
        Если период не передан, возвращается текущее агрегированное состояние.
      operationId: getPnl
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
      responses:
        '200':
          description: Сводка по PnL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /history/portfolio:
    get:
      tags: [History]
      summary: Получить историю изменений портфеля
      description: |
        Исторические срезы портфеля для аналитики и графиков.
        Может читаться из ClickHouse.
      operationId: getPortfolioHistory
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: interval
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
            default: 1h
      responses:
        '200':
          description: История портфеля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /history/positions:
    get:
      tags: [History]
      summary: Получить историю изменений позиции по инструменту
      operationId: getPositionHistory
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: symbol
          required: true
          schema:
            type: string
            example: AAPL
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: interval
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
            default: 1h
      responses:
        '200':
          description: История позиции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /summary:
    get:
      tags: [Analytics]
      summary: Получить краткую сводку портфеля
      description: |
        Легковесный endpoint для dashboard:
        cash, equity, market value, total pnl, positions count.
      operationId: getPortfolioSummary
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Краткая сводка портфеля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /internal/events/trade-executed:
    post:
      tags: [Internal]
      summary: Обработать событие исполненной сделки
      description: |
        Внутренний endpoint для обновления позиций и PnL
        на основании сделки из Order Service.
        В реальной системе чаще вызывается Kafka-consumer'ом,
        но для контракта полезно явно показать входную модель события.
      operationId: handleTradeExecuted
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeExecutedEvent'
      responses:
        '202':
          description: Событие принято в обработку
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /internal/rebuild/{userId}:
    post:
      tags: [Internal]
      summary: Пересобрать портфель пользователя из истории сделок
      description: |
        Технический endpoint для восстановления состояния
        при рассинхронизации или для reprocessing.
      operationId: rebuildPortfolio
      security:
        - internalServiceAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '202':
          description: Пересборка запущена
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /internal/valuation:
    post:
      tags: [Internal]
      summary: Пересчитать valuation для набора позиций
      description: |
        Технический endpoint для пакетного расчета market value
        по последним ценам из Market Data Service.
      operationId: recalculateValuation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValuationRequest'
      responses:
        '200':
          description: Valuation рассчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /system/health:
    get:
      tags: [System]
      summary: Health endpoint
      operationId: health
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/ready:
    get:
      tags: [System]
      summary: Readiness endpoint
      operationId: ready
      responses:
        '200':
          description: Сервис готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    internalGatewayAuth:
      type: apiKey
      in: header
      name: X-Gateway-Key

    internalServiceAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: integer
        format: int64

    XTraceId:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string

    Symbol:
      in: path
      name: symbol
      required: true
      schema:
        type: string
        example: AAPL

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedInternal:
      description: Запрос не прошел внутреннюю авторизацию gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedService:
      description: Запрос не прошел внутреннюю сервисную авторизацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PositionResponse:
      type: object
      required:
        - symbol
        - quantity
        - avgPrice
        - currentPrice
        - marketValue
        - unrealizedPnl
        - currency
        - updatedAt
      properties:
        symbol:
          type: string
          example: AAPL
        quantity:
          type: integer
          minimum: 0
          example: 10
        avgPrice:
          type: string
          example: "185.50"
        currentPrice:
          type: string
          example: "190.13"
        marketValue:
          type: string
          example: "1901.30"
        unrealizedPnl:
          type: string
          example: "46.30"
        realizedPnl:
          type: string
          nullable: true
          example: "15.00"
        currency:
          type: string
          example: USD
        updatedAt:
          type: string
          format: date-time

    PositionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PositionResponse'

    PortfolioResponse:
      type: object
      required:
        - userId
        - cashBalance
        - totalMarketValue
        - totalEquity
        - unrealizedPnl
        - realizedPnl
        - totalPnl
        - positions
        - updatedAt
      properties:
        userId:
          type: integer
          format: int64
        cashBalance:
          type: string
          example: "150000.00"
        totalMarketValue:
          type: string
          example: "5400.20"
        totalEquity:
          type: string
          example: "155400.20"
        unrealizedPnl:
          type: string
          example: "120.20"
        realizedPnl:
          type: string
          example: "45.00"
        totalPnl:
          type: string
          example: "165.20"
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionResponse'
        updatedAt:
          type: string
          format: date-time

    PnlResponse:
      type: object
      required:
        - realizedPnl
        - unrealizedPnl
        - totalPnl
        - currency
      properties:
        realizedPnl:
          type: string
          example: "45.00"
        unrealizedPnl:
          type: string
          example: "120.20"
        totalPnl:
          type: string
          example: "165.20"
        currency:
          type: string
          example: USD

    PortfolioSummaryResponse:
      type: object
      required:
        - userId
        - cashBalance
        - totalEquity
        - totalMarketValue
        - totalPnl
        - positionsCount
        - updatedAt
      properties:
        userId:
          type: integer
          format: int64
        cashBalance:
          type: string
        totalEquity:
          type: string
        totalMarketValue:
          type: string
        totalPnl:
          type: string
        positionsCount:
          type: integer
        updatedAt:
          type: string
          format: date-time

    PortfolioHistoryPoint:
      type: object
      required:
        - timestamp
        - cashBalance
        - totalMarketValue
        - totalEquity
        - totalPnl
      properties:
        timestamp:
          type: string
          format: date-time
        cashBalance:
          type: string
        totalMarketValue:
          type: string
        totalEquity:
          type: string
        totalPnl:
          type: string

    PortfolioHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioHistoryPoint'

    PositionHistoryPoint:
      type: object
      required:
        - timestamp
        - symbol
        - quantity
        - avgPrice
        - currentPrice
        - marketValue
        - unrealizedPnl
      properties:
        timestamp:
          type: string
          format: date-time
        symbol:
          type: string
        quantity:
          type: integer
        avgPrice:
          type: string
        currentPrice:
          type: string
        marketValue:
          type: string
        unrealizedPnl:
          type: string

    PositionHistoryResponse:
      type: object
      required: [symbol, items]
      properties:
        symbol:
          type: string
          example: AAPL
        items:
          type: array
          items:
            $ref: '#/components/schemas/PositionHistoryPoint'

    TradeExecutedEvent:
      type: object
      required:
        - tradeId
        - orderId
        - userId
        - symbol
        - side
        - quantity
        - price
        - grossAmount
        - executedAt
      additionalProperties: false
      properties:
        tradeId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        symbol:
          type: string
          example: AAPL
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
          minimum: 1
        price:
          type: string
          example: "190.13"
        grossAmount:
          type: string
          example: "1901.30"
        feeAmount:
          type: string
          nullable: true
          example: "1.90"
        executedAt:
          type: string
          format: date-time

    ValuationPosition:
      type: object
      required: [symbol, quantity, avgPrice]
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        avgPrice:
          type: string

    ValuationRequest:
      type: object
      required: [positions]
      additionalProperties: false
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/ValuationPosition'

    ValuationItem:
      type: object
      required:
        - symbol
        - quantity
        - currentPrice
        - marketValue
        - unrealizedPnl
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        currentPrice:
          type: string
        marketValue:
          type: string
        unrealizedPnl:
          type: string

    ValuationResponse:
      type: object
      required: [items, totalMarketValue, totalUnrealizedPnl]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValuationItem'
        totalMarketValue:
          type: string
        totalUnrealizedPnl:
          type: string

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: portfolio-service
        timestamp:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]

    ReadinessResponse:
      type: object
      required: [status, service, dependencies, timestamp]
      properties:
        status:
          type: string
          enum: [READY, NOT_READY, DEGRADED]
        service:
          type: string
          example: portfolio-service
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyStatus'
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string