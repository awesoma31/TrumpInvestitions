openapi: 3.1.0
info:
  title: Auth Gateway API
  version: 1.0.0
  description: |
    Единая внешняя точка входа в систему.

    Сервис совмещает две роли:
    1. Auth Service:
       - регистрация
       - логин
       - refresh token
       - logout
    2. API Gateway:
       - проверка JWT на защищенных запросах
       - маршрутизация запросов к backend-сервисам
       - единый HTTP API для клиента

servers:
  - url: https://api.example.com/api/v1
    description: Public production endpoint
  - url: http://localhost:8080/api/v1
    description: Local development endpoint

tags:
  - name: Auth
    description: Аутентификация и токены
  - name: Market
    description: Рыночные данные
  - name: Orders
    description: Торговые заявки и сделки
  - name: Portfolio
    description: Портфель и баланс
  - name: System
    description: Служебные endpoint'ы

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  username: investor_01
                  email: investor01@example.com
                  password: StrongPass123!
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username или email уже заняты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход пользователя
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              byUsername:
                value:
                  login: investor_01
                  password: StrongPass123!
              byEmail:
                value:
                  login: investor01@example.com
                  password: StrongPass123!
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access token по refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token недействителен или отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход пользователя
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout выполнен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token недействителен или уже отозван
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market/instruments:
    get:
      tags: [Market]
      summary: Получить список инструментов по поисковому запросу
      operationId: searchInstruments
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Поиск по тикеру или названию инструмента
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список инструментов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /market/instruments/{symbol}:
    get:
      tags: [Market]
      summary: Получить инструмент по тикеру
      operationId: getInstrumentBySymbol
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: Данные инструмента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '404':
          $ref: '#/components/responses/NotFound'

  /market/quotes:
    get:
      tags: [Market]
      summary: Получить котировки по списку тикеров
      operationId: getQuotes
      parameters:
        - in: query
          name: symbols
          required: true
          schema:
            type: string
            example: AAPL,MSFT,GOOG
      responses:
        '200':
          description: Список котировок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /market/quotes/{symbol}:
    get:
      tags: [Market]
      summary: Получить срез котировок по тикеру
      operationId: getQuoteBySymbol
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: Срез котировок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'

  /market/history/candles:
    get:
      tags: [Market]
      summary: Получить историю котировок по инструменту
      operationId: getCandleHistory
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
            example: AAPL
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: interval
          required: true
          schema:
            $ref: '#/components/schemas/CandleInterval'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        '200':
          description: История котировок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /market/order-book/{symbol}:
    get:
      tags: [Market]
      summary: Получить стакан bid/ask по инструменту
      operationId: getOrderBook
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - in: query
          name: depth
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Стакан по инструменту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [Orders]
      summary: Создать рыночную заявку
      description: |
        Создает заявку на покупку или продажу акций.

        Поведение в MVP:
        - если на рынке достаточно встречного объема — заявка исполняется сразу и получает статус FILLED
        - если объема недостаточно — заявка автоматически получает статус REJECTED

        Частичное исполнение и отложенные заявки не поддерживаются.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заявка создана и обработана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Бизнес-ошибка обработки заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Orders]
      summary: Получить историю заявок пользователя
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/OrderSide'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: История заявок пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Получить заявку по id
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Отменить заявку вручную
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заявка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявку нельзя отменить в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trades:
    get:
      tags: [Orders]
      summary: Получить историю сделок пользователя
      operationId: listTrades
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/OrderSide'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: История сделок пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trades/{tradeId}:
    get:
      tags: [Orders]
      summary: Получить сделку по id
      operationId: getTradeById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TradeId'
      responses:
        '200':
          description: Данные сделки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /portfolio:
    get:
      tags: [Portfolio]
      summary: Получить текущее состояние портфеля
      operationId: getPortfolio
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Состояние портфеля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/positions:
    get:
      tags: [Portfolio]
      summary: Получить список активов пользователя
      operationId: listPositions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
      responses:
        '200':
          description: Список позиций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/positions/{symbol}:
    get:
      tags: [Portfolio]
      summary: Получить позицию по конкретному тикеру
      operationId: getPositionBySymbol
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: Позиция по инструменту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /portfolio/pnl:
    get:
      tags: [Portfolio]
      summary: Получить доходность портфеля
      operationId: getPortfolioPnl
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Агрегированный PnL по портфелю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPnlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/balance/deposit:
    post:
      tags: [Portfolio]
      summary: Пополнить баланс пользователя
      operationId: depositBalance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceOperationRequest'
      responses:
        '200':
          description: Баланс пополнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/balance/withdraw:
    post:
      tags: [Portfolio]
      summary: Вывести средства с баланса пользователя
      operationId: withdrawBalance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceOperationRequest'
      responses:
        '200':
          description: Средства выведены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Недостаточно средств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /portfolio/orders:
    get:
      tags: [Portfolio]
      summary: Получить историю заявок пользователя
      operationId: listUserOrdersHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: История заявок пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /portfolio/trades:
    get:
      tags: [Portfolio]
      summary: Получить историю сделок пользователя
      operationId: listUserTradesHistory
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/OrderSide'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: История сделок пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeHistoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /system/health:
    get:
      tags: [System]
      summary: Health endpoint
      operationId: health
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/ready:
    get:
      tags: [System]
      summary: Readiness endpoint
      operationId: ready
      responses:
        '200':
          description: Сервис готов принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Symbol:
      in: path
      name: symbol
      required: true
      schema:
        type: string
        example: AAPL

    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid

    TradeId:
      in: path
      name: tradeId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Пользователь не аутентифицирован или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login:
          type: string
          description: Username или email
          minLength: 3
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 16

    LogoutRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 16

    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
        - user
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 900
        refreshExpiresIn:
          type: integer
          example: 2592000
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, username, email, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Instrument:
      type: object
      required: [symbol, name, currency, lotSize, active]
      additionalProperties: false
      properties:
        symbol:
          type: string
          example: AAPL
        name:
          type: string
          example: Apple Inc.
        currency:
          type: string
          example: USD
        lotSize:
          type: integer
          minimum: 1
          example: 1
        active:
          type: boolean

    InstrumentListResponse:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Quote:
      type: object
      required: [symbol, bid, ask, last, timestamp]
      additionalProperties: false
      properties:
        symbol:
          type: string
          example: AAPL
        bid:
          type: string
          example: "190.12"
        ask:
          type: string
          example: "190.15"
        last:
          type: string
          example: "190.13"
        open:
          type: string
          nullable: true
        high:
          type: string
          nullable: true
        low:
          type: string
          nullable: true
        close:
          type: string
          nullable: true
        volume:
          type: integer
          format: int64
          nullable: true
        timestamp:
          type: string
          format: date-time

    QuoteListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quote'

    CandleInterval:
      type: string
      enum: [1m, 5m, 15m, 1h, 1d]

    Candle:
      type: object
      required: [timestamp, open, high, low, close, volume]
      additionalProperties: false
      properties:
        timestamp:
          type: string
          format: date-time
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: integer
          format: int64

