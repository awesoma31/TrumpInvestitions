openapi: 3.1.0
info:
  title: Order Service API
  version: 1.0.0
  description: |
    Внутренний сервис торговых заявок и сделок.

    Ответственность сервиса:
    - создание рыночных заявок на покупку/продажу
    - отмена заявок
    - хранение жизненного цикла заявки
    - фиксация сделок (trades)
    - публикация событий в Kafka для downstream-сервисов
      (например, Portfolio Service)

servers:
  - url: http://order-service.internal/api/v1
    description: Internal environment

tags:
  - name: Orders
  - name: Trades
  - name: Internal

paths:
  /orders:
    post:
      tags: [Orders]
      summary: Создать новую заявку
      description: |
        Создает рыночную заявку пользователя.

        Для MVP:
        - BUY = купить актив по лучшим доступным предложениям продажи (ask)
        - SELL = продать актив по лучшим доступным предложениям покупки (bid)

        Пользователь не выбирает конкретную заявку из стакана.
        Стакан используется только как источник информации о текущем рынке.
        Создает новую рыночную заявку пользователя.

        Для MVP поддерживается только тип MARKET.
        Пользователь передается через заголовки gateway
        после успешной аутентификации клиента.
      operationId: createOrder
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUsername'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              buyMarket:
                value:
                  symbol: AAPL
                  side: BUY
                  type: MARKET
                  quantity: 10
              sellMarket:
                value:
                  symbol: AAPL
                  side: SELL
                  type: MARKET
                  quantity: 5
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '422':
          description: Бизнес-ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  value:
                    code: INSUFFICIENT_FUNDS
                    message: Not enough cash balance to place BUY market order
                    traceId: 4d1bfc77f42a4d79
                insufficientAssets:
                  value:
                    code: INSUFFICIENT_ASSETS
                    message: Not enough asset quantity to place SELL market order
                    traceId: 4d1bfc77f42a4d79
                instrumentUnavailable:
                  value:
                    code: INSTRUMENT_UNAVAILABLE
                    message: Trading instrument is not active
                    traceId: 4d1bfc77f42a4d79

    get:
      tags: [Orders]
      summary: Получить список заявок пользователя
      operationId: listOrders
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/OrderSide'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Получить заявку по id
      operationId: getOrderById
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Отменить заявку
      operationId: cancelOrder
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Заявка отменена или переведена в CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заявку нельзя отменить в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  value:
                    code: ORDER_NOT_CANCELLABLE
                    message: Order cannot be cancelled in status FILLED
                    traceId: 4d1bfc77f42a4d79

  /trades:
    get:
      tags: [Trades]
      summary: Получить историю сделок пользователя
      operationId: listTrades
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
        - in: query
          name: symbol
          schema:
            type: string
            example: AAPL
        - in: query
          name: side
          schema:
            $ref: '#/components/schemas/OrderSide'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Список сделок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'

  /trades/{tradeId}:
    get:
      tags: [Trades]
      summary: Получить сделку по id
      operationId: getTradeById
      security:
        - internalGatewayAuth: []
      parameters:
        - $ref: '#/components/parameters/TradeId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Данные сделки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/orders/{orderId}/status:
    post:
      tags: [Internal]
      summary: Внутреннее обновление статуса заявки
      description: |
        Используется внутренними процессами исполнения заявок,
        воркерами или matching-логикой.
      operationId: updateOrderStatusInternal
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Статус обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный внутренний сервисный ключ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/trades:
    post:
      tags: [Internal]
      summary: Внутреннее создание сделки
      description: |
        Используется внутренним процессом исполнения.
        Обычно вызывается не gateway, а внутренним worker / engine.
      operationId: createTradeInternal
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTradeRequest'
      responses:
        '201':
          description: Сделка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный внутренний сервисный ключ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Сделка не может быть создана в текущем состоянии заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /internal/events/order-created:
    post:
      tags: [Internal]
      summary: Зафиксировать факт публикации события order_created
      description: |
        Технический endpoint для outbox / delivery confirmation,
        если нужна явная синхронизация между процессами.
        В простом варианте может отсутствовать в реализации.
      operationId: markOrderCreatedEventPublished
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishedEventRequest'
      responses:
        '204':
          description: Событие отмечено как опубликованное
        '401':
          description: Неверный внутренний сервисный ключ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/health:
    get:
      tags: [Internal]
      summary: Health endpoint
      operationId: health
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/ready:
    get:
      tags: [Internal]
      summary: Readiness endpoint
      operationId: ready
      responses:
        '200':
          description: Сервис готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    internalGatewayAuth:
      type: apiKey
      in: header
      name: X-Gateway-Key

    internalServiceAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: integer
        format: int64
      description: Идентификатор пользователя, проставленный gateway

    XUsername:
      in: header
      name: X-Username
      required: false
      schema:
        type: string
      description: Username пользователя, проставленный gateway

    XTraceId:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string

    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid

    TradeId:
      in: path
      name: tradeId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedInternal:
      description: Запрос не прошел внутреннюю авторизацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderType:
      type: string
      enum: [MARKET]

    OrderStatus:
      type: string
      enum: [NEW, ACCEPTED, FILLED, CANCELLED, REJECTED]

    CreateOrderRequest:
      type: object
      required: [symbol, side, type, quantity]
      additionalProperties: false
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 32
          example: AAPL
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
          minimum: 1
          example: 10

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejectionReason:
          type: string
          nullable: true
        filledQuantity:
          type: integer
          minimum: 0
          nullable: true
        avgFillPrice:
          type: string
          nullable: true
          example: "190.14"

    CreateTradeRequest:
      type: object
      required:
        - orderId
        - userId
        - symbol
        - side
        - quantity
        - price
        - executedAt
      additionalProperties: false
      properties:
        orderId:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        symbol:
          type: string
          example: AAPL
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: integer
          minimum: 1
        price:
          type: string
          example: "190.14"
        executedAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      required:
        - id
        - userId
        - symbol
        - side
        - type
        - quantity
        - filledQuantity
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: integer
        filledQuantity:
          type: integer
        requestedAtPrice:
          type: string
          nullable: true
          description: Для MARKET заявки обычно null
        avgFillPrice:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        filledAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    OrderListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    TradeResponse:
      type: object
      required:
        - id
        - orderId
        - userId
        - symbol
        - side
        - quantity
        - price
        - grossAmount
        - executedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: integer
        price:
          type: string
          example: "190.14"
        grossAmount:
          type: string
          example: "1901.40"
        feeAmount:
          type: string
          nullable: true
          example: "1.90"
        executedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TradeListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TradeResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PublishedEventRequest:
      type: object
      required: [aggregateId, eventType, publishedAt]
      additionalProperties: false
      properties:
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
          example: order_created
        publishedAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: order-service
        timestamp:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]

    ReadinessResponse:
      type: object
      required: [status, service, dependencies, timestamp]
      properties:
        status:
          type: string
          enum: [READY, NOT_READY, DEGRADED]
        service:
          type: string
          example: order-service
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyStatus'
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string