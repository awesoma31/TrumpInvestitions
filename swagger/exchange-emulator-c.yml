openapi: 3.1.0
info:
  title: Exchange Emulator API
  version: 1.0.0
  description: |
    Внутренний API эмулятора биржи.

    Ответственность компонента:
    - генерация потока котировок
    - генерация снимков стакана
    - воспроизводимые сценарии рыночного поведения
    - ручное и автоматическое управление симуляцией
    - отправка рыночных данных в Market Data Service

servers:
  - url: http://exchange-emulator.internal/api/v1
    description: Internal environment

tags:
  - name: Scenarios
  - name: Simulation
  - name: Instruments
  - name: Internal
  - name: System

paths:
  /scenarios:
    post:
      tags: [Scenarios]
      summary: Создать сценарий симуляции
      description: |
        Загружает новый сценарий генерации рыночных данных.
        Сценарий может быть детерминированным для воспроизводимых тестов.
      operationId: createScenario
      security:
        - internalServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '201':
          description: Сценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

    get:
      tags: [Scenarios]
      summary: Получить список сценариев
      operationId: listScenarios
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Список сценариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /scenarios/{scenarioId}:
    get:
      tags: [Scenarios]
      summary: Получить сценарий по id
      operationId: getScenarioById
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Данные сценария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Scenarios]
      summary: Удалить сценарий
      operationId: deleteScenario
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '204':
          description: Сценарий удалён
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '404':
          $ref: '#/components/responses/NotFound'

  /simulation/start:
    post:
      tags: [Simulation]
      summary: Запустить симуляцию
      description: |
        Запускает генерацию котировок и стаканов по выбранному сценарию.
      operationId: startSimulation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSimulationRequest'
      responses:
        '202':
          description: Симуляция запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '409':
          description: Симуляция уже выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /simulation/stop:
    post:
      tags: [Simulation]
      summary: Остановить симуляцию
      operationId: stopSimulation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Симуляция остановлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/pause:
    post:
      tags: [Simulation]
      summary: Поставить симуляцию на паузу
      operationId: pauseSimulation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Симуляция поставлена на паузу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/resume:
    post:
      tags: [Simulation]
      summary: Возобновить симуляцию
      operationId: resumeSimulation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Симуляция возобновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/status:
    get:
      tags: [Simulation]
      summary: Получить текущий статус симуляции
      operationId: getSimulationStatus
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Статус симуляции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/tick:
    post:
      tags: [Simulation]
      summary: Выполнить один шаг симуляции вручную
      description: |
        Полезно для тестов и отладки. Генерирует один тик данных:
        котировку и при необходимости обновление стакана.
      operationId: stepSimulation
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepSimulationRequest'
      responses:
        '200':
          description: Шаг симуляции выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationTickResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/publish/quote:
    post:
      tags: [Internal]
      summary: Ручная публикация одной котировки
      description: |
        Технический endpoint для ручного тестирования без запуска полного сценария.
      operationId: publishQuote
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishQuoteRequest'
      responses:
        '202':
          description: Котировка отправлена в Market Data Service
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

  /simulation/publish/order-book:
    post:
      tags: [Internal]
      summary: Ручная публикация снимка стакана
      operationId: publishOrderBook
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishOrderBookRequest'
      responses:
        '202':
          description: Снимок стакана отправлен в Market Data Service
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'

/instruments:
  get:
    tags: [Instruments]
    summary: Получить список инструментов, доступных в эмуляторе
    operationId: listInstruments
    security:
      - internalServiceAuth: []
    parameters:
      - $ref: '#/components/parameters/XTraceId'
    responses:
      '200':
        description: Список инструментов
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentListResponse'
      '401':
        $ref: '#/components/responses/UnauthorizedService'

  post:
    tags: [Instruments]
    summary: Зарегистрировать инструмент в эмуляторе
    operationId: registerInstrument
    security:
      - internalServiceAuth: []
    parameters:
      - $ref: '#/components/parameters/XTraceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterInstrumentRequest'
    responses:
      '201':
        description: Инструмент зарегистрирован
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentResponse'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/UnauthorizedService'
      '409':
        description: Инструмент уже существует
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  /instruments/{symbol}:
    get:
      tags: [Instruments]
      summary: Получить инструмент по тикеру
      operationId: getInstrument
      security:
        - internalServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/XTraceId'
      responses:
        '200':
          description: Инструмент
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/health:
    get:
      tags: [System]
      summary: Health endpoint
      operationId: health
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /system/ready:
    get:
      tags: [System]
      summary: Readiness endpoint
      operationId: ready
      responses:
        '200':
          description: Сервис готов принимать команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    internalServiceAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Key

  parameters:
    XTraceId:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string

    ScenarioId:
      in: path
      name: scenarioId
      required: true
      schema:
        type: string
        format: uuid

    Symbol:
      in: path
      name: symbol
      required: true
      schema:
        type: string
        example: AAPL

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedService:
      description: Запрос не прошел внутреннюю сервисную авторизацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ScenarioMode:
      type: string
      enum: [DETERMINISTIC, RANDOM_WALK, VOLATILE, TREND_UP, TREND_DOWN]

    SimulationState:
      type: string
      enum: [IDLE, RUNNING, PAUSED, STOPPED]

    InstrumentResponse:
      type: object
      required:
        - symbol
        - name
        - currency
        - basePrice
        - tickSize
        - lotSize
        - active
      properties:
        symbol:
          type: string
          example: AAPL
        name:
          type: string
          example: Apple Inc.
        currency:
          type: string
          example: USD
        basePrice:
          type: string
          example: "190.00"
        tickSize:
          type: string
          example: "0.01"
        lotSize:
          type: integer
          example: 1
        active:
          type: boolean

    InstrumentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentResponse'

    RegisterInstrumentRequest:
      type: object
      required: [symbol, name, currency, basePrice, tickSize, lotSize]
      additionalProperties: false
      properties:
        symbol:
          type: string
          example: AAPL
        name:
          type: string
        currency:
          type: string
          example: USD
        basePrice:
          type: string
          example: "190.00"
        tickSize:
          type: string
          example: "0.01"
        lotSize:
          type: integer
          minimum: 1
          example: 1

    CreateScenarioRequest:
      type: object
      required: [name, mode, instruments, tickIntervalMs]
      additionalProperties: false
      properties:
        name:
          type: string
          example: demo-session-1
        description:
          type: string
          nullable: true
        mode:
          $ref: '#/components/schemas/ScenarioMode'
        seed:
          type: integer
          format: int64
          nullable: true
          description: Seed для воспроизводимости
        tickIntervalMs:
          type: integer
          minimum: 1
          example: 1000
        instruments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScenarioInstrumentConfig'
        autoPublish:
          type: boolean
          default: true

    ScenarioInstrumentConfig:
      type: object
      required: [symbol, startPrice]
      properties:
        symbol:
          type: string
          example: AAPL
        startPrice:
          type: string
          example: "190.00"
        volatility:
          type: string
          nullable: true
          example: "0.02"
        trendPerTick:
          type: string
          nullable: true
          example: "0.01"

    ScenarioResponse:
      type: object
      required:
        - id
        - name
        - mode
        - tickIntervalMs
        - instruments
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        mode:
          $ref: '#/components/schemas/ScenarioMode'
        seed:
          type: integer
          format: int64
          nullable: true
        tickIntervalMs:
          type: integer
        autoPublish:
          type: boolean
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioInstrumentConfig'
        createdAt:
          type: string
          format: date-time

    ScenarioListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioResponse'

    StartSimulationRequest:
      type: object
      required: [scenarioId]
      additionalProperties: false
      properties:
        scenarioId:
          type: string
          format: uuid
        runForTicks:
          type: integer
          minimum: 1
          nullable: true
        publishQuotes:
          type: boolean
          default: true
        publishOrderBook:
          type: boolean
          default: true

    SimulationStatusResponse:
      type: object
      required:
        - state
        - startedAt
        - ticksProcessed
      properties:
        state:
          $ref: '#/components/schemas/SimulationState'
        scenarioId:
          type: string
          format: uuid
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        pausedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        ticksProcessed:
          type: integer
          format: int64
        lastTickAt:
          type: string
          format: date-time
          nullable: true

    StepSimulationRequest:
      type: object
      additionalProperties: false
      properties:
        publish:
          type: boolean
          default: true

    GeneratedQuote:
      type: object
      required: [symbol, bid, ask, last, volume, timestamp]
      properties:
        symbol:
          type: string
          example: AAPL
        bid:
          type: string
          example: "190.12"
        ask:
          type: string
          example: "190.15"
        last:
          type: string
          example: "190.13"
        volume:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time

    GeneratedOrderBookLevel:
      type: object
      required: [price, quantity]
      properties:
        price:
          type: string
          example: "190.12"
        quantity:
          type: integer
          minimum: 1

    GeneratedOrderBook:
      type: object
      required: [symbol, bids, asks, timestamp]
      properties:
        symbol:
          type: string
          example: AAPL
        bids:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedOrderBookLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedOrderBookLevel'
        timestamp:
          type: string
          format: date-time

    SimulationTickResponse:
      type: object
      required: [tickNumber, generatedQuotes]
      properties:
        tickNumber:
          type: integer
          format: int64
        generatedQuotes:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedQuote'
        generatedOrderBooks:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedOrderBook'

    PublishQuoteRequest:
      type: object
      required:
        - symbol
        - bid
        - ask
        - last
        - open
        - high
        - low
        - close
        - volume
        - timestamp
      additionalProperties: false
      properties:
        symbol:
          type: string
          example: AAPL
        bid:
          type: string
          example: "190.12"
        ask:
          type: string
          example: "190.15"
        last:
          type: string
          example: "190.13"
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        volume:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time

    PublishOrderBookLevel:
      type: object
      required: [price, quantity]
      properties:
        price:
          type: string
        quantity:
          type: integer
          minimum: 1

    PublishOrderBookRequest:
      type: object
      required: [symbol, bids, asks, timestamp]
      additionalProperties: false
      properties:
        symbol:
          type: string
          example: AAPL
        bids:
          type: array
          items:
            $ref: '#/components/schemas/PublishOrderBookLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/PublishOrderBookLevel'
        timestamp:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: exchange-emulator
        timestamp:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: market-data-service
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]

    ReadinessResponse:
      type: object
      required: [status, service, dependencies, timestamp]
      properties:
        status:
          type: string
          enum: [READY, NOT_READY, DEGRADED]
        service:
          type: string
          example: exchange-emulator
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyStatus'
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string

    ErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field:
          type: string
        issue:
          type: string